<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Wir packen für die Reise</title>
<style>
  :root{--ink:#2b2d42;--ok:#2e9d57;--bad:#d9534f;--blue:#5b63b7;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;min-height:100%;}
  body{font-family:"Andika","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(#fdf8ee,#f1ead9);user-select:none;-webkit-user-select:none;
    display:flex;flex-direction:column;align-items:center;min-height:100vh;}
  header{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px;}
  h1{font-size:clamp(20px,3vw,30px);margin:0 6px;}
  .pill{border:none;border-radius:999px;padding:8px 14px;font:inherit;font-size:clamp(14px,1.8vw,18px);
    background:#fff;box-shadow:0 2px 0 #d8cfb8;cursor:pointer;color:var(--ink);text-decoration:none;}
  .pill.on{background:var(--blue);color:#fff;box-shadow:0 2px 0 #3c4290;}
  .verbs{display:flex;gap:14px;}
  .verb{display:flex;align-items:center;gap:8px;border:4px solid transparent;border-radius:999px;background:#fff;
    padding:4px 16px 4px 4px;cursor:pointer;font:inherit;font-weight:bold;font-size:clamp(17px,2.4vw,24px);
    box-shadow:0 3px 0 #d8cfb8;color:var(--ink);}
  .verb img{height:clamp(44px,7vh,62px);border-radius:50%;}
  .verb.on{border-color:var(--blue);background:#eef0ff;}

  .kids{display:flex;gap:clamp(6px,2vw,24px);justify-content:center;align-items:flex-end;padding:4px 10px;width:100%;}
  .kid{flex:0 1 220px;display:flex;flex-direction:column;align-items:center;background:#fff;border-radius:22px;
    padding:8px 6px 8px;box-shadow:0 4px 0 #e0d7c1;border:4px solid transparent;transition:border-color .15s,transform .15s;cursor:pointer;}
  .kid.hover,.kid.target{border-color:#f0a83a;transform:translateY(-4px);}
  .kid .fig{height:clamp(150px,30vh,280px);pointer-events:none;}
  .kid .name{font-size:clamp(18px,2.6vw,26px);font-weight:bold;display:flex;align-items:center;gap:6px;}
  .kid .name img{height:30px;border-radius:5px;}
  .kid .dest{font-size:clamp(12px,1.4vw,15px);color:#8a7f66;}
  .bag{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;min-height:44px;margin-top:6px;
    width:100%;border-top:2px dashed #e5dcc6;padding-top:6px;}
  .bag img{height:40px;max-width:64px;object-fit:contain;cursor:pointer;}
  .bag img.anz{outline:2px solid #c9d3b4;border-radius:6px;}

  .tray{display:flex;flex-wrap:wrap;gap:clamp(8px,1.5vw,16px);justify-content:center;align-items:center;
    margin:14px 10px 8px;padding:12px;background:rgba(255,255,255,.6);border-radius:24px;min-height:120px;max-width:1200px;}
  .item{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:6px 8px;border-radius:16px;
    background:#fff;box-shadow:0 3px 0 #e0d7c1;cursor:grab;touch-action:none;border:3px solid transparent;}
  .item img{height:clamp(60px,10vh,95px);max-width:clamp(90px,13vw,150px);object-fit:contain;pointer-events:none;}
  .item span{font-size:clamp(14px,1.7vw,18px);font-weight:bold;}
  .item.sel{border-color:#f0a83a;transform:scale(1.06);}
  .item.gone{display:none;}
  .ghost{position:fixed;pointer-events:none;z-index:50;opacity:.9;transform:translate(-50%,-50%) scale(1.1);}
  .ghost img{height:90px;}
  .hint{font-size:clamp(14px,1.8vw,18px);color:#8a7f66;text-align:center;min-height:22px;}

  /* Satzkarte */
  .overlay{position:fixed;inset:0;background:rgba(40,40,60,.35);display:none;align-items:center;justify-content:center;z-index:40;}
  .overlay.show{display:flex;}
  .card{background:#fff;border-radius:26px;padding:18px 26px;max-width:94vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.25);}
  .card .pics{display:flex;gap:14px;justify-content:center;align-items:center;}
  .card .pics img{height:clamp(70px,13vh,120px);object-fit:contain;}
  .sentence{font-size:clamp(24px,4vw,44px);font-weight:bold;margin:12px 0;}
  .gap{display:inline-block;min-width:2.6em;border-bottom:4px solid var(--blue);color:var(--blue);}
  .arts{display:flex;gap:12px;justify-content:center;margin:6px 0 4px;}
  .art{font:inherit;font-weight:bold;font-size:clamp(22px,3.4vw,34px);border:none;border-radius:16px;padding:8px 22px;cursor:pointer;color:#fff;}
  .a-den{background:#3c7fd0;box-shadow:0 5px 0 #255a99;}
  .a-die{background:#d9534f;box-shadow:0 5px 0 #9b302d;}
  .a-das{background:#2e9d57;box-shadow:0 5px 0 #1e6e3c;}
  .art:active{transform:translateY(3px);}
  #cardFb{min-height:30px;font-size:clamp(16px,2.2vw,22px);}
  #cardFb.ok{color:var(--ok);} #cardFb.bad{color:var(--bad);}
  .small{font:inherit;border:none;background:#eee;border-radius:12px;padding:6px 14px;cursor:pointer;margin:6px 4px 0;font-size:16px;}

  /* Satzliste */
  .list{width:min(1100px,96vw);background:#fff;border-radius:20px;padding:10px 18px;margin:6px 0 20px;box-shadow:0 3px 0 #e0d7c1;}
  .list h2{font-size:20px;margin:4px 0 6px;display:flex;justify-content:space-between;align-items:center;}
  .list ol{margin:0;padding-left:28px;font-size:clamp(17px,2.2vw,23px);line-height:1.6;}
  .list li{cursor:pointer;}
  .list li:hover{color:var(--blue);}
  .confetti{position:fixed;top:-30px;font-size:28px;pointer-events:none;animation:fall 2s linear forwards;z-index:60;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);}}
  .shake{animation:shake .4s;}
  @keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
</style>
</head>

const $=id=>document.getElementById(id);
let verb="anziehen", reiseCheck=true, selected=null, pending=null;
let placed=[]; // {kid, item, verb, text}

/* Ton */
let actx=null;
function beep(f,d,v=.15,type="sine"){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;
  g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+d);o.connect(g).connect(actx.destination);o.start();o.stop(actx.currentTime+d);}catch(e){}}
let deVoice=null;
function pickVoice(){const v=speechSynthesis.getVoices();deVoice=v.find(x=>/^de(-|_)DE/i.test(x.lang))||v.find(x=>/^de/i.test(x.lang))||null;}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function say(t){if(!("speechSynthesis" in window))return;speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t);u.lang="de-DE";u.rate=.8;if(deVoice)u.voice=deVoice;speechSynthesis.speak(u);}

/* Kinder zeichnen */
function drawKids(){
  $("kids").innerHTML="";
  KIDS.forEach(k=>{
    const d=document.createElement("div");d.className="kid";d.dataset.kid=k.n;
    d.innerHTML=`<img class="fig" src="${k.fig}" alt="" draggable="false">
      <div class="name">${k.n}</div><div class="dest">${k.dest}</div><div class="bag"></div>`;
    d.onclick=()=>{ if(selected) give(selected,k.n); };
    $("kids").appendChild(d);
  });
  renderBags();
}
function renderBags(){
  document.querySelectorAll(".kid").forEach(el=>{
    const bag=el.querySelector(".bag");bag.innerHTML="";
    placed.filter(p=>p.kid===el.dataset.kid).forEach(p=>{
      const im=document.createElement("img");im.src=p.item.img;im.title=p.text;
      if(p.verb==="anziehen")im.className="anz";
      im.onclick=e=>{e.stopPropagation();say(p.text);};
      bag.appendChild(im);
    });
  });
  $("sentences").innerHTML="";
  placed.forEach(p=>{const li=document.createElement("li");li.textContent=p.text;li.onclick=()=>say(p.text);$("sentences").appendChild(li);});
}

/* Ablage */
function drawTray(){
  $("tray").innerHTML="";
  ITEMS[verb].forEach(it=>{
    const d=document.createElement("div");d.className="item";
    if(placed.some(p=>p.item===it)) d.classList.add("gone");
    d.innerHTML=`<img src="${it.img}" alt="" draggable="false"><span>${it.w}</span>`;
    d._item=it; enableDrag(d); $("tray").appendChild(d);
  });
  checkDone();
}
function enableDrag(el){
  let sx,sy,ghost=null,moved=false,over=null;
  el.addEventListener("pointerdown",e=>{
    sx=e.clientX;sy=e.clientY;moved=false;el.setPointerCapture(e.pointerId);
  });
  el.addEventListener("pointermove",e=>{
    if(sx===undefined)return;
    if(!moved && Math.hypot(e.clientX-sx,e.clientY-sy)>10){
      moved=true;ghost=document.createElement("div");ghost.className="ghost";
      ghost.innerHTML=`<img src="${el._item.img}">`;document.body.appendChild(ghost);el.style.opacity=.3;
    }
    if(moved){ghost.style.left=e.clientX+"px";ghost.style.top=e.clientY+"px";
      const k=document.elementFromPoint(e.clientX,e.clientY)?.closest(".kid");
      if(over&&over!==k)over.classList.remove("hover"); if(k)k.classList.add("hover"); over=k;}
  });
  const up=e=>{
    if(sx===undefined)return; sx=undefined;
    if(moved){ghost.remove();el.style.opacity="";
      if(over){over.classList.remove("hover");give(el._item,over.dataset.kid);}
      over=null;
    } else { // Antippen = auswählen
      document.querySelectorAll(".item.sel").forEach(x=>x.classList.remove("sel"));
      if(selected===el._item){selected=null;}
      else {selected=el._item;el.classList.add("sel");beep(660,.08);
        $("hint").textContent=`${el._item.w}: Wer ${VERB[verb].f} das ${VERB[verb].p}? Tippe auf ein Kind.`;}
    }
  };
  el.addEventListener("pointerup",up);el.addEventListener("pointercancel",up);
}

/* Gegenstand einem Kind geben → Satz bauen */
function give(item,kidName){
  selected=null;document.querySelectorAll(".item.sel").forEach(x=>x.classList.remove("sel"));
  const kid=KIDS.find(k=>k.n===kidName);
  if(reiseCheck && !item.fit.includes(kidName)){
    const el=document.querySelector(`.kid[data-kid="${kidName}"]`);
    el.classList.remove("shake");void el.offsetWidth;el.classList.add("shake");beep(200,.25,.2,"square");
    const ein = item.pl ? "" : ({den:"einen ",das:"ein ",die:"eine "})[item.acc];
    const t=`Braucht ${kidName} ${kid.wo} ${ein}${item.w}? 🤔`;
    $("hint").textContent=t; say(t.replace("🤔",""));
    return;
  }
  pending={item,kid,verb};
  $("cKid").src=kid.fig;$("cVerb").src=VERB[verb].img;$("cItem").src=item.img;
  $("cSentence").innerHTML=`${kid.n} ${VERB[verb].f} <span class="gap" id="gap">&nbsp;?&nbsp;</span> ${item.w} ${VERB[verb].p}.`;
  $("cardFb").textContent="";$("cardFb").className="";
  $("overlay").classList.add("show");
  $("hint").textContent="Zieh ein Bild zu einem Kind – oder tippe zuerst auf das Bild, dann auf das Kind.";
}
document.querySelectorAll(".art").forEach(b=>b.onclick=()=>{
  if(!pending)return; const a=b.dataset.a, it=pending.item;
  if(a===it.acc){
    const text=`${pending.kid.n} ${VERB[pending.verb].f} ${a} ${it.w} ${VERB[pending.verb].p}.`;
    $("gap").textContent=a;$("cardFb").className="ok";
    $("cardFb").textContent=["Super! 🎉","Richtig! 🌟","Toll! 👍","Prima! 🧳"][Math.floor(Math.random()*4)];
    say(text);beep(880,.12);setTimeout(()=>beep(1175,.18),120);
    placed.push({kid:pending.kid.n,item:it,verb:pending.verb,text});pending=null;
    setTimeout(()=>{$("overlay").classList.remove("show");renderBags();drawTray();},1500);
  } else {
    $("cardFb").className="bad";
    $("cardFb").innerHTML=`Hm… hör genau hin: <b>${it.nom} ${it.w}</b> → ${pending.kid.n} ${VERB[pending.verb].f} … ${it.w} ${VERB[pending.verb].p}.`;
    $("card").classList.remove("shake");void $("card").offsetWidth;$("card").classList.add("shake");beep(200,.25,.2,"square");
  }
});
$("cRead").onclick=()=>{ if(pending) say(`${pending.kid.n} ${VERB[pending.verb].f} … ${pending.item.w} ${VERB[pending.verb].p}`); };
$("cCancel").onclick=()=>{pending=null;$("overlay").classList.remove("show");};

function checkDone(){
  const all=Object.values(ITEMS).flat();
  if(placed.length===all.length){
    $("hint").textContent="Alle Kinder sind bereit für die Reise! 🎉";say("Alle Kinder sind bereit für die Reise!");confetti();
  } else if(ITEMS[verb].every(it=>placed.some(p=>p.item===it))){
    $("hint").textContent= verb==="anziehen" ? "Alles angezogen! Jetzt wird eingepackt 👉" : "Alles eingepackt! Ist auch alles angezogen? 👉";
  }
}
function confetti(){const e=["🎉","⭐","✨","🧳"];for(let i=0;i<22;i++){const s=document.createElement("div");s.className="confetti";
  s.textContent=e[i%4];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*.6+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2800);}}

/* Schalter */
document.querySelectorAll(".verb").forEach(b=>b.onclick=()=>{
  verb=b.dataset.v;document.querySelectorAll(".verb").forEach(x=>x.classList.toggle("on",x===b));
  selected=null;say(verb);drawTray();
});
$("check").onclick=()=>{reiseCheck=!reiseCheck;$("check").classList.toggle("on",reiseCheck);
  $("check").textContent=reiseCheck?"🧭 Passt es zur Reise?":"🧭 Alles erlaubt";};
$("reset").onclick=()=>{placed=[];renderBags();drawTray();};
$("readAll").onclick=()=>say(placed.map(p=>p.text).join(" "));

drawKids();drawTray();
</script>
</body>
</html>
