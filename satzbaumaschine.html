<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Satzbaumaschine – Wer fährt womit?</title>
<style>
  :root{
    --bg:#eef0f6; --ink:#2b2d42; --frame:#6b6f86;
    --w1:#c9d3b4; --w2:#f4f4f2; --w3:#c3c9ea; --w4:#a9b1e0; --w5:#8c95d4;
    --ok:#2e9d57; --bad:#d9534f;
    --fh: clamp(78px, 13vh, 120px);
    --ww: clamp(92px, 15vw, 175px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;}
  body{
    font-family:"Andika","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
    background:radial-gradient(circle at 50% 0%, #fff 0%, var(--bg) 60%);
    color:var(--ink); display:flex; flex-direction:column; align-items:center;
    user-select:none; -webkit-user-select:none; overflow-x:hidden;
  }
  header{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;padding:10px 10px 0;}
  h1{font-size:clamp(20px,3vw,32px);margin:0 8px 0 0;}
  .pill{border:none;border-radius:999px;padding:8px 16px;font:inherit;font-size:clamp(14px,1.8vw,18px);
        background:#fff;box-shadow:0 2px 0 #c7cadb;cursor:pointer;color:var(--ink);}
  .pill.on{background:#5b63b7;color:#fff;box-shadow:0 2px 0 #3c4290;}

  /* Auftrag */
  #task{margin:10px 0 0;display:none;align-items:center;gap:14px;background:#fff;border-radius:18px;
        padding:8px 18px;box-shadow:0 3px 0 #d5d8e6;font-size:clamp(16px,2.2vw,22px);}
  #task .pics{display:flex;gap:10px;} #task .pics img{height:clamp(50px,8vh,70px);border-radius:8px;}
  body.auftrag #task{display:flex;}

  /* Maschine */
  .machine{position:relative;margin:14px auto 0;padding:18px 22px 18px 70px;
    background:linear-gradient(#dfe1ea,#cfd2df);border-radius:26px;
    border:6px solid var(--frame);box-shadow:0 10px 0 #4f5368, 0 16px 30px rgba(0,0,0,.18);}
  .axle{position:absolute;left:-6px;top:50%;width:76px;height:22px;margin-top:-11px;
    background:linear-gradient(#9aa0b4,#6d7389 50%,#9aa0b4);border-radius:6px;}
  .crank{position:absolute;left:-44px;top:50%;width:90px;height:90px;margin-top:-45px;cursor:pointer;
    transition:transform 1.6s cubic-bezier(.2,.7,.2,1);}
  .crank svg{width:100%;height:100%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.3));}
  .wheels{display:flex;gap:clamp(4px,1vw,12px);align-items:center;}
  .wheel{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .arrow{width:calc(var(--ww)*.62);height:clamp(34px,5vh,46px);border:none;border-radius:14px;
    font-size:clamp(18px,2.6vw,26px);cursor:pointer;background:#fff;color:#5b63b7;box-shadow:0 3px 0 #b9bdd3;}
  .arrow:active{transform:translateY(2px);box-shadow:0 1px 0 #b9bdd3;}
  .arrow.hidden{visibility:hidden;}
  .window{position:relative;width:var(--ww);height:calc(var(--fh)*2.6);perspective:900px;
    border-radius:20px;overflow:hidden;cursor:grab;touch-action:none;
    box-shadow:inset 0 14px 18px -8px rgba(0,0,0,.35), inset 0 -14px 18px -8px rgba(0,0,0,.35);}
  .window.fixed{cursor:not-allowed;}
  .window::after{content:"";position:absolute;left:0;right:0;top:50%;height:var(--fh);margin-top:calc(var(--fh)/-2);
    border-top:4px solid rgba(255,190,40,.9);border-bottom:4px solid rgba(255,190,40,.9);pointer-events:none;border-radius:4px;}
  .drum{position:absolute;inset:0;transform-style:preserve-3d;}
  .drum.anim{transition:transform .35s cubic-bezier(.3,1.4,.5,1);}
  .drum.spin{transition:transform var(--spin,1.6s) cubic-bezier(.15,.75,.2,1);}
  .face{position:absolute;left:6%;width:88%;top:50%;height:var(--fh);margin-top:calc(var(--fh)/-2);
    backface-visibility:hidden;-webkit-backface-visibility:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    border-radius:10px;border:2px solid rgba(0,0,0,.12);background:#fff;}
  .face .pic{height:calc(var(--fh)*.6);max-width:90%;object-fit:contain;border-radius:6px;pointer-events:none;}
  .face .word{font-size:clamp(15px,calc(var(--fh)*.2),24px);font-weight:bold;}
  .face.only .word{font-size:clamp(22px,calc(var(--fh)*.34),40px);}
  body.nopics .face .pic{display:none;}
  body.nopics .face .word{font-size:clamp(20px,calc(var(--fh)*.3),36px);}
  .shake{animation:shake .4s;}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  .tag{font-size:12px;color:#777;height:16px;}

  /* Satzstreifen */
  .strip{margin:18px 10px 0;background:#fff;border-radius:16px;padding:12px 22px;min-height:64px;
    font-size:clamp(24px,4vw,44px);font-weight:bold;box-shadow:0 4px 0 #d2d5e4;text-align:center;
    border:4px solid transparent;transition:border-color .2s;}
  .strip.ok{border-color:var(--ok);} .strip.bad{border-color:var(--bad);}
  .strip .art{color:#5b63b7;text-decoration:underline wavy #bfc4ef;}
  .buttons{display:flex;gap:12px;margin:14px 0 6px;flex-wrap:wrap;justify-content:center;}
  .big{border:none;border-radius:18px;padding:12px 22px;font:inherit;font-size:clamp(17px,2.4vw,24px);
    cursor:pointer;color:#fff;font-weight:bold;}
  .big:active{transform:translateY(3px);}
  .b-read{background:#f0a83a;box-shadow:0 5px 0 #b97a1c;}
  .b-check{background:var(--ok);box-shadow:0 5px 0 #1e6e3c;}
  .b-crank{background:#7a62c7;box-shadow:0 5px 0 #50409a;}
  .b-next{background:#3c8fd6;box-shadow:0 5px 0 #23649f;display:none;}
  body.auftrag .b-next{display:inline-block;}
  #fb{min-height:34px;font-size:clamp(16px,2.3vw,24px);text-align:center;padding:0 12px 14px;}
  #fb.ok{color:var(--ok);} #fb.bad{color:var(--bad);}
  .stars{font-size:22px;margin-top:2px;}
  .confetti{position:fixed;top:-30px;font-size:28px;pointer-events:none;animation:fall 2s linear forwards;}
  @keyframes fall{to{transform:translateY(110vh) rotate(540deg);}}
</style>
</head>
<body>
<header>
  <a class="pill" href="index.html">🏠</a>
  <h1>⚙️ Satzbaumaschine</h1>
  <button class="pill on" id="mFree">Frei bauen</button>
  <button class="pill" id="mTask">Auftrag</button>
  <button class="pill" id="mPics">🖼️ Bilder an</button>
</header>

<div id="task"><span>Bau diesen Satz:</span><span class="pics" id="taskPics"></span></div>

<div class="machine">
  <div class="axle"></div>
  <div class="crank" id="crank" title="Kurbel drehen">
    <svg viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="22" fill="#8b91a8" stroke="#4f5368" stroke-width="4"/>
      <polygon points="50,34 64,42 64,58 50,66 36,58 36,42" fill="#b6bbcc" stroke="#4f5368" stroke-width="3"/>
      <rect x="46" y="4" width="8" height="46" rx="4" fill="#4f5368"/>
      <circle cx="50" cy="8" r="9" fill="#e2533f" stroke="#8d2a1d" stroke-width="3"/>
    </svg>
  </div>
  <div class="wheels" id="wheels"></div>
</div>

<div class="strip" id="strip"></div>
<div class="buttons">
  <button class="big b-crank" id="bCrank">🎰 Kurbeln</button>
  <button class="big b-read" id="bRead">🔊 Vorlesen</button>
  <button class="big b-check" id="bCheck">✅ Prüfen</button>
  <button class="big b-next" id="bNext">➡️ Neuer Auftrag</button>
</div>
<div id="fb"></div>

const $ = id => document.getElementById(id);
let audioCtx = null;
function tick(f=1200, d=.03, v=.15){
  try{
    audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
    const o=audioCtx.createOscillator(), g=audioCtx.createGain();
    o.type="square"; o.frequency.value=f; g.gain.value=v;
    g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime+d);
    o.connect(g).connect(audioCtx.destination); o.start(); o.stop(audioCtx.currentTime+d);
  }catch(e){}
}

const wheels = [];
function fh(){ return parseFloat(getComputedStyle(document.querySelector('.window')).height)/2.6; }

function build(){
  const box = $("wheels");
  WHEELS.forEach((cfg, wi) => {
    const el = document.createElement("div"); el.className="wheel";
    const up = document.createElement("button"); up.className="arrow"+(cfg.fixed?" hidden":""); up.textContent="▲";
    const dn = document.createElement("button"); dn.className="arrow"+(cfg.fixed?" hidden":""); dn.textContent="▼";
    const win = document.createElement("div"); win.className="window"+(cfg.fixed?" fixed":"");
    win.style.background = `linear-gradient(90deg, rgba(0,0,0,.18), transparent 25%, transparent 75%, rgba(0,0,0,.18)), ${cfg.color}`;
    const drum = document.createElement("div"); drum.className="drum";
    // Trommel mit genug Flächen füllen
    let faces=[]; while(faces.length<8) faces = faces.concat(cfg.items);
    if(faces.length>16) faces = cfg.items.slice();
    faces.forEach(it=>{
      const f=document.createElement("div"); f.className="face"+(it.img?"":" only");
      f.style.background = cfg.color==="var(--w2)" ? "#fff" : "#fff";
      f.innerHTML = (it.img?`<img class="pic" src="${it.img}" alt="" draggable="false">`:"") + `<div class="word">${it.w}</div>`;
      drum.appendChild(f);
    });
    win.appendChild(drum);
    const tag=document.createElement("div"); tag.className="tag";
    el.append(up, win, dn, tag); box.appendChild(el);
    const W = {cfg, faces, drum, win, tag, pos:0, n:faces.length};
    wheels.push(W);

    if(cfg.fixed){
      win.addEventListener("pointerdown", ()=>{
        win.classList.remove("shake"); void win.offsetWidth; win.classList.add("shake");
        tick(220,.12,.2); tag.textContent="🔒 bleibt stehen";
        setTimeout(()=>tag.textContent="",1200);
      });
    } else {
      up.onclick = ()=>step(W, +1);
      dn.onclick = ()=>step(W, -1);
      let startY=0, startPos=0, drag=false, last=0;
      win.addEventListener("pointerdown", e=>{
        drag=true; startY=e.clientY; startPos=W.pos; last=Math.round(W.pos);
        win.setPointerCapture(e.pointerId); drum.classList.remove("anim","spin"); win.style.cursor="grabbing";
      });
      win.addEventListener("pointermove", e=>{
        if(!drag) return;
        W.pos = startPos - (e.clientY-startY)/fh();
        if(Math.round(W.pos)!==last){ last=Math.round(W.pos); tick(); }
        render(W);
      });
      const end = ()=>{ if(!drag) return; drag=false; win.style.cursor="";
        W.pos=Math.round(W.pos); drum.classList.add("anim"); render(W); changed(); };
      win.addEventListener("pointerup", end); win.addEventListener("pointercancel", end);
      win.addEventListener("wheel", e=>{ e.preventDefault(); step(W, e.deltaY>0?1:-1); }, {passive:false});
    }
    layout(W);
  });
}

function layout(W){
  const h=fh(), a=360/W.n, r=(h/2)/Math.tan(Math.PI/W.n);
  W.r=r; W.a=a;
  [...W.drum.children].forEach((f,k)=>{ f.style.transform=`rotateX(${-k*a}deg) translateZ(${r}px)`; });
  render(W);
}
function render(W){ W.drum.style.transform=`translateZ(${-W.r}px) rotateX(${W.pos*W.a}deg)`; }
function idx(W){ return ((Math.round(W.pos)%W.n)+W.n)%W.n; }
function current(W){ return W.faces[idx(W)]; }
function step(W, d){ W.drum.classList.remove("spin"); W.drum.classList.add("anim"); W.pos+=d; render(W); tick(); changed(); }

function words(){
  return wheels.map(current);
}
function sentence(){
  const w=words().map(x=>x.w);
  w[0]=w[0][0].toUpperCase()+w[0].slice(1);
  return w.join(" ")+".";
}
function changed(){
  const w=words().map(x=>x.w); w[0]=w[0][0].toUpperCase()+w[0].slice(1);
  $("strip").innerHTML = `${w[0]} ${w[1]} ${w[2]} <span class="art">${w[3]}</span> ${w[4]}.`;
  $("strip").className="strip"; $("fb").textContent=""; $("fb").className="";
}

/* Vorlesen */
let deVoice=null;
function pickVoice(){ const v=speechSynthesis.getVoices(); deVoice = v.find(x=>/^de(-|_)DE/i.test(x.lang)) || v.find(x=>/^de/i.test(x.lang)) || null; }
if("speechSynthesis" in window){ pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; }
function say(t){
  if(!("speechSynthesis" in window)) return;
  speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(t);
  u.lang="de-DE"; u.rate=.8; if(deVoice) u.voice=deVoice; speechSynthesis.speak(u);
}
$("bRead").onclick = ()=>say(sentence());

/* Prüfen */
let mode="free", target=null, streak=0;
$("bCheck").onclick = ()=>{
  const [p,,,art,v]=words(); const fb=$("fb");
  if(mode==="task" && (p.w!==target.p.w || v.w!==target.v.w)){
    $("strip").className="strip bad"; fb.className="bad";
    fb.textContent = p.w!==target.p.w ? "Schau noch einmal: Wer fährt? 👀" : "Schau noch einmal: Womit fährt er/sie? 👀";
    tick(180,.25,.2); streak=0; return;
  }
  if(art.w===v.a){
    streak++; $("strip").className="strip ok"; fb.className="ok";
    fb.innerHTML = ["Super! 🎉","Toll gemacht! 🌟","Richtig! 👍","Prima! 🚀"][Math.floor(Math.random()*4)]
      + `<div class="stars">${"⭐".repeat(Math.min(streak,10))}</div>`;
    say(sentence()); confetti();
  } else {
    streak=0; $("strip").className="strip bad"; fb.className="bad";
    fb.innerHTML = `Hm… hör genau hin! &nbsp; <b>${v.art} ${v.w}</b> → mit <b>${v.a==="dem"?"dem":"der"}</b> …?`;
    tick(180,.25,.2);
  }
};
function confetti(){
  const e=["🎉","⭐","✨","🎊"];
  for(let i=0;i<18;i++){ const s=document.createElement("div"); s.className="confetti";
    s.textContent=e[i%4]; s.style.left=Math.random()*100+"vw"; s.style.animationDelay=Math.random()*.5+"s";
    document.body.appendChild(s); setTimeout(()=>s.remove(),2600); }
}

/* Kurbel: bewegliche Räder zufällig drehen */
let crankAngle=0, spinning=false;
function crank(){
  if(spinning) return; spinning=true;
  crankAngle += 720; $("crank").style.transform=`rotate(${crankAngle}deg)`;
  let t=0; const iv=setInterval(()=>{ tick(900+Math.random()*500); if(++t>14) clearInterval(iv); }, 100);
  wheels.forEach((W,i)=>{ if(W.cfg.fixed) return;
    W.drum.classList.remove("anim"); W.drum.classList.add("spin");
    W.drum.style.setProperty("--spin", (1.2+i*.15)+"s");
    W.pos += W.n + Math.floor(Math.random()*W.n) + 1; render(W);
  });
  setTimeout(()=>{ spinning=false; changed(); }, 2000);
}
$("bCrank").onclick=crank; $("crank").onclick=crank;

$("mFree").onclick=()=>{ mode="free"; document.body.classList.remove("auftrag"); $("mFree").classList.add("on"); $("mTask").classList.remove("on"); changed(); };

$("bNext").onclick=newTask;
$("mPics").onclick=()=>{ const off=document.body.classList.toggle("nopics");

build(); changed();
